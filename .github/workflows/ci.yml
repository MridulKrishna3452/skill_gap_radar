name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API - lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: skillradar_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d skillradar_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/skillradar_ci
      REDIS_URL: redis://localhost:6379/0
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - name: Install
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Migrations (up, down, up)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Models match migrations
        run: alembic check
      - name: Seed reference data
        run: python -m app.cli seed
      - name: Tests
        run: pytest -q
      - name: Extraction evaluation gate
        # The labelled set contains Adzuna text and is kept out of the repository, so this gate
        # is run locally before each phase closes (owner decision 2026-11-21; threshold 0.89,
        # see ROADMAP.md and data/eval_sets/README.md). It only runs here if the file is present.
        run: |
          if [ -f ../../data/eval_sets/extraction_v1.jsonl ]; then
            python -m app.cli eval-extraction \
              --path ../../data/eval_sets/extraction_v1.jsonl \
              --min-f1 "${EXTRACTION_MIN_F1:-0.89}"
          else
            echo "Labelled extraction set is private; the F1 gate (>= 0.89) runs locally."
          fi

  api-image:
    name: API - Docker build
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t skillradar-api:ci apps/api

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
