[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "skillradar-api"
version = "2.0.0.dev0"
description = "SkillRadar AI 2.0 backend: FastAPI REST API and Celery workers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "pgvector>=0.3,<1",
    "redis>=5.2,<7",
    "celery[redis]>=5.4,<6",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20,<1",
    "spacy>=3.8,<4",
    "pymupdf>=1.25,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "respx>=0.22,<1",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "celery-types>=0.22",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Operator CLI: one-shot commands where blocking file I/O and non-crypto randomness are fine.
"app/cli.py" = ["ASYNC230", "ASYNC240", "S311", "T201"]
# Syllabi and job ads use en dashes as separators ("Unit 1 – Basics"); matching them is intended.
"app/services/curriculum/parser.py" = ["RUF001"]
"app/services/extraction/extractor.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs a real Postgres and Redis (DATABASE_URL / REDIS_URL)"]
